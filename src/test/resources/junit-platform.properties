cucumber.glue=com.inforqa.steps
cucumber.plugin=io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm, html:target/cucumber-reports/report.html, json:target/cucumber-reports/report.json, summary
cucumber.publish.quiet=true

# Parallel execution: run up to 3 scenarios (3 browsers) at the same time.
# Turn off with: mvn test -Dcucumber.execution.parallel.enabled=false
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=3
cucumber.execution.parallel.config.fixed.max-pool-size=3
